# 家肴记生产 nginx 反向代理片段（2026-11-01，对应缺陷 D6-08）
# 用途：前端同源调用、但不带 /api 前缀的 AI 接口必须代理到后端，否则 POST 返回 405、GET 返回 index.html
# 安装：整段粘贴到 /etc/nginx/conf.d/jiayaoji.conf 的 443 server { } 块内（放在 location /api/ 之后），
#       然后 sudo nginx -t && sudo nginx -s reload
# 维护：后端新增非 /api 路由时，需同步追加到下方 regex 列表

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # 前端 index.html 中实际调用的非 /api 路由：
    # /plan（生成三餐、各类 AI 文本）、/recommend-dishes（AI 点菜）、/recommend-restaurants（餐厅推荐）、
    # /parse-menu-image、/parse-menu-url（菜单识别）、/recognize_ingredients（食材识别）、
    # /chef-image（创作配图）、/ai/usage、/ai/budget、/ai/vision
    location ~ ^/(plan|recommend-dishes|recommend-restaurants|parse-menu-image|parse-menu-url|recognize_ingredients|chef-image|ai/usage|ai/budget|ai/vision)$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location /ai/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 180s;
    }
