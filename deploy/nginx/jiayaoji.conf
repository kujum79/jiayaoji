# 家肴记生产 nginx 站点配置基线（2026-11-02）
# 对应服务器文件：/etc/nginx/conf.d/jiayaoji.conf（内容按线上原样抄录，便于 diff）
# 用途：前端同源调用、但不带 /api 前缀的 AI 接口必须代理到后端，否则 POST 返回 405、GET 返回 index.html（D6-08）
# 维护：① 改这里 → 同步到服务器 → sudo nginx -t && sudo nginx -s reload；
#       ② 后端新增非 /api 路由时，必须同步追加到下方 regex；
#       ③ 带 "# managed by Certbot" 的行由 certbot 维护，升级证书时可能被重写，不要手改。

server {
    server_name jiayaoji.cn www.jiayaoji.cn 47.97.178.39;

    location / {
        root /var/www/jiayaoji/frontend;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ~ ^/(plan|recommend-dishes|recommend-restaurants|parse-menu-image|parse-menu-url|recognize_ingredients|chef-image|ai/usage|ai/budget|ai/vision)$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location /ai/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 180s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/jiayaoji.cn/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/jiayaoji.cn/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.jiayaoji.cn) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = jiayaoji.cn) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name jiayaoji.cn www.jiayaoji.cn 47.97.178.39;
    return 404; # managed by Certbot
}
